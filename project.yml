name: KibleBul
options:
  bundleIdPrefix: com.miktat55
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.4.0

targets:
  KibleBul:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        # ÖNEMLİ — LOKALİZASYON DÜZELTMESİ (9 Eylül 2026):
        # xx.lproj klasörleri (tr.lproj, en.lproj, ar.lproj, ...) burada TEK TEK
        # ayrı kaynak olarak DEĞİL, ortak üst klasör "Resources" tek bir kaynak
        # olarak verilir. XcodeGen, aynı isimli dosyaları (ör. Localizable.strings)
        # birbirine "localized variant group" olarak SADECE ortak bir üst klasör
        # taranırken karşılaşılan .lproj alt klasörleri için bağlar. Her .lproj'u
        # ayrı ayrı üst seviye kaynak olarak listelemek (önceki hatalı hâl) bu
        # eşleştirmeyi bozuyordu: her dilin Localizable.strings dosyası birbirinden
        # bağımsız, düz bir kaynakmış gibi eklendi ve hiçbiri uygulama paketinde
        # doğru "<dil>.lproj/Localizable.strings" yoluna kopyalanmadı. Sonuç:
        # NSLocalizedString / Text(_:) çağrıları hiçbir çeviri bulamadı ve ekranda
        # çeviri yerine anahtar metinler (ör. "compass.title", "tab.compass")
        # olduğu gibi göründü — derleme başarılı olduğu için bu hata TestFlight'a
        # kadar fark edilmedi. Bu satırı tekrar ayrı ayrı .lproj listesine
        # DÖNÜŞTÜRMEYİN.
        excludes:
          - "Sounds/**"
      - path: Resources/Sounds
        # "group" (varsayılan) olarak eklenir, "folder reference" DEĞİL:
        # bu sayede içine konan ses dosyaları (ör. adhan_classic_notification.caf)
        # uygulama paketinin KÖKÜNE düz olarak kopyalanır. UNNotificationSound(named:)
        # bir alt klasör yolunu kabul etmez — sadece bu şekilde çalışır. Bu ayarı
        # değiştirmeyin (bkz. AdhanPlayer.swift + README-TR.md "Ezan Sesi Ekleme").
        # "Resources" kaynağından "excludes" ile hariç tutulup burada ayrı
        # tanımlanmasının nedeni budur — genel .lproj/asset taramasına karışmasın.
        type: group
        optional: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Kıble Bul"
        CFBundleIconName: "AppIcon"
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "7"
        # Dil desteği: uygulama Türkçe'yi temel dil olarak kullanır, geri kalan
        # 8 dil aşağıdaki listede tanımlıdır. Her .lproj klasöründeki
        # Localizable.strings / InfoPlist.strings dosyaları XcodeGen tarafından
        # otomatik olarak "Localized Resource" olarak paketlenir çünkü klasör adı
        # "<dil kodu>.lproj" biçimindedir (Apple kuralı).
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations:
          - tr
          - en
          - ar
          - de
          - fr
          - nl
          - ur
          - id
          - ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Kıble yönünü ve bulunduğunuz konuma göre ezan vakitlerini hesaplayabilmek için konumunuza ihtiyacımız var. Konumunuz hiçbir sunucuya gönderilmez, yalnızca cihazınızda işlenir."
        NSCameraUsageDescription: "Kıble yönünü canlı kamera görüntüsü üzerinde gösterebilmek için kameraya ihtiyacımız var. Görüntü kaydedilmez ve hiçbir yere gönderilmez."
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: "ca-app-pub-8580294286333632~1988794070"
