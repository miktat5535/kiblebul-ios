# Codemagic CI/CD yapılandırması — Kıble Bul (iOS)
#
# Bu dosya, kodu GitHub'a push ettiğinizde Codemagic'in bulutta otomatik
# olarak bir Mac açıp uygulamayı derlemesini, imzalamasını ve (isteğe bağlı
# olarak) TestFlight'a yüklemesini sağlar. Siz hiçbir zaman bir Mac
# görmeniz gerekmez — her şeyi Windows'ta, bir web tarayıcısından
# yönetirsiniz.
#
# Kod imzalama: Codemagic'in "otomatik imzalama" özelliği kullanılır
# (environment.ios_signing). Codemagic, App Store Connect API anahtarını
# kullanarak sertifikayı ve provisioning profile'ı bir kez oluşturur ve
# kendi kasasında saklar; sonraki derlemelerde aynısını yeniden kullanır.

workflows:
  ios-kiblebul:
    name: Kıble Bul iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.miktat55.kiblebul"
        XCODE_SCHEME: "KibleBul"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.miktat55.kiblebul
    integrations:
      app_store_connect: app_store_connect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: XcodeGen ile .xcodeproj oluştur
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Bağımlılıkları çöz (Swift Package Manager)
        script: |
          xcodebuild -resolvePackageDependencies -project KibleBul.xcodeproj

      - name: Archive ve .ipa oluştur
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --project "KibleBul.xcodeproj" --scheme "$XCODE_SCHEME" || { echo "===== XCODEBUILD LOG ====="; tail -150 /tmp/xcodebuild_logs/*.log; exit 1; }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - miktat55@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
