# Codemagic CI/CD yapılandırması — Kıble Bul (iOS)
#
# Kod imzalama, Codemagic'te KALICI olarak saklanan kimliklerle yapılır:
#   - Sertifika:  kiblebul_distribution      (Apple Distribution)
#   - Profil:     kiblebul_appstore_profile  (App Store, com.miktat55.kiblebul)
#
# Bu sayede her derlemede Apple'da yeni sertifika oluşturulmaz; Apple'ın
# "en fazla 3 dağıtım sertifikası" sınırına takılma sorunu ortadan kalkar.
# Kimlikleri değiştirmek gerekirse: Codemagic > Settings >
# Code signing identities.

workflows:
  ios-kiblebul:
    name: Kıble Bul iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "KibleBul"
      ios_signing:
        provisioning_profiles:
          - kiblebul_appstore_profile
        certificates:
          - kiblebul_distribution
    integrations:
      app_store_connect: app_store_connect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: XcodeGen ile .xcodeproj oluştur
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Bağımlılıkları çöz (Swift Package Manager)
        script: |
          xcodebuild -resolvePackageDependencies -project KibleBul.xcodeproj

      - name: Archive ve .ipa oluştur
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --project "KibleBul.xcodeproj" --scheme "$XCODE_SCHEME" || { echo "===== XCODEBUILD LOG ====="; tail -150 /tmp/xcodebuild_logs/*.log; exit 1; }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - miktat55@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
