# Codemagic CI/CD yapılandırması — Kıble Bul (iOS)
#
# Bu dosya, kodu GitHub'a push ettiğinizde Codemagic'in bulutta otomatik
# olarak bir Mac açıp uygulamayı derlemesini, imzalamasını ve TestFlight'a
# yüklemesini sağlar. Siz hiçbir zaman bir Mac görmeniz gerekmez.
#
# Kod imzalama notu:
# Derleme makinesinde yeni bir özel anahtar üretilip App Store Connect API
# ile dağıtım sertifikası ve provisioning profile oluşturulur
# (fetch-signing-files --create). Apple hesap başına en fazla 3 dağıtım
# sertifikasına izin verir; bu yüzden eski/kullanılmayan sertifikaları
# developer.apple.com > Certificates bölümünden ara sıra temizlemek
# gerekebilir.

workflows:
  ios-kiblebul:
    name: Kıble Bul iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.miktat55.kiblebul"
        XCODE_SCHEME: "KibleBul"
    integrations:
      app_store_connect: app_store_connect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: XcodeGen ile .xcodeproj oluştur
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Otomatik kod imzalama profillerini kur
        script: |
          keychain initialize && ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Bağımlılıkları çöz (Swift Package Manager)
        script: |
          xcodebuild -resolvePackageDependencies -project KibleBul.xcodeproj

      - name: Archive ve .ipa oluştur
        script: |
          xcode-project build-ipa --project "KibleBul.xcodeproj" --scheme "$XCODE_SCHEME" || { echo "===== XCODEBUILD LOG ====="; tail -150 /tmp/xcodebuild_logs/*.log; exit 1; }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - miktat55@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
